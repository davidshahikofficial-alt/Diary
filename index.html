  :root{
    --cream:#faf3ea;
    --paper:#fffaf3;

    --ink:#4a3f36;

    --line:#e6d8c4;
    --shadow: 0 10px 30px rgba(74,63,54,0.12);

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}

    font-family:'Nunito',sans-serif;
    background:var(--cream);
    color:var(--ink);
    overflow-x:hidden;
  }
  h1,h2,h3,.script{font-family:'Playfair Display',serif;}
  button{font-family:'Nunito',sans-serif;cursor:pointer;}
  input,textarea{font-family:'Nunito',sans-serif;}

  #lock-card{
    position:relative;
    z-index:2;
    background:rgba(255,250,243,0.94);
    backdrop-filter:blur(6px);
    border-radius:22px;
    padding:38px 34px 30px;
    width:88%;
    max-width:340px;
    text-align:center;
    box-shadow:var(--shadow);
    animation:floatIn 0.7s ease;
  }
  @keyframes floatIn{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
  #lock-card h1{
    margin:0 0 4px;
    font-size:1.7rem;
    color:var(--terracotta-dark);
  }
  #lock-card p.sub{
    margin:0 0 22px;
    font-size:0.85rem;
    color:var(--ink-soft);
    letter-spacing:0.02em;
  }
  #lock-card input{
    width:100%;
    padding:12px 14px;
    border-radius:12px;
    border:1.5px solid var(--line);
    background:var(--paper);
    font-size:0.95rem;
    margin-bottom:12px;
    outline:none;
    color:var(--ink);
    text-align:center;
    letter-spacing:0.15em;
  }
  #lock-card input:focus{border-color:var(--terracotta);}
  .lock-btn{
    width:100%;
    padding:12px;
    border:none;
    border-radius:12px;
    background:var(--terracotta);
    color:#fff;
    font-weight:700;
    font-size:0.95rem;
    letter-spacing:0.02em;
    transition:background 0.2s;
  }
  .lock-btn:hover{background:var(--terracotta-dark);}
  #lock-error{
    color:#b5482f;
    font-size:0.8rem;
    margin-top:10px;
    min-height:14px;
  }
  #lock-hint{
    margin-top:16px;
    font-size:0.75rem;
    color:var(--ink-soft);
    text-decoration:underline;
    cursor:pointer;
    background:none;
    border:none;
    padding:0;
  }
  .lock-flower{font-size:1.4rem;margin-bottom:6px;display:block;}

  /* ---------- MAIN APP ---------- */
  #app{
    display:none;
    min-height:100vh;
    animation:fadeUp 0.6s ease;
  }
  @keyframes fadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}

  header.hero{
    position:relative;
    padding:26px 20px 90px;
    background:linear-gradient(160deg,var(--sand) 0%, var(--cream) 70%);
    text-align:center;
    overflow:hidden;
  }
  header.hero .decor{
    position:absolute;top:-40px;right:-40px;
    width:160px;height:160px;
    border-radius:50%;
    background:rgba(193,122,86,0.15);
  }
  header.hero .decor2{
    position:absolute;bottom:-60px;left:-30px;
    width:140px;height:140px;
    border-radius:50%;
    background:rgba(193,122,86,0.10);
  }
  .avatar-wrap{
    width:104px;height:104px;
    border-radius:50%;
    margin:0 auto 14px;
    padding:5px;
    background:var(--paper);
    box-shadow:var(--shadow);
    position:relative;
  }
  .avatar-wrap img{
    width:100%;height:100%;
    object-fit:cover;
    border-radius:50%;
    display:block;
  }
  header.hero h1{
    margin:0 0 4px;
    font-size:1.6rem;
    color:var(--ink);
  }
  header.hero p{
    margin:0;
    color:var(--ink-soft);
    font-size:0.9rem;
  }
  #lock-toggle{
    position:absolute;
    top:20px;right:20px;
    background:rgba(255,255,255,0.6);
    border:none;
    border-radius:50%;
    width:38px;height:38px;
    font-size:1rem;
    color:var(--ink-soft);
  }

  main{
    max-width:640px;
    margin:-56px auto 60px;
    padding:0 18px;
    position:relative;
    z-index:2;
  }

  .card{
    background:var(--paper);
    border-radius:20px;
    box-shadow:var(--shadow);
    padding:22px;
    margin-bottom:22px;
  }

  #new-entry .row-top{
    display:flex;justify-content:space-between;align-items:center;
    margin-bottom:14px;
  }
  #new-entry h2{margin:0;font-size:1.15rem;color:var(--terracotta-dark);}
  #entry-date{font-size:0.8rem;color:var(--ink-soft);}

  .mood-row{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
  .mood-btn{
    border:1.5px solid var(--line);
    background:var(--cream);
    border-radius:12px;
    padding:7px 12px;
    font-size:1rem;
    opacity:0.55;
    transition:all 0.15s;
  }
  .mood-btn.selected{
    opacity:1;
    border-color:var(--terracotta);
    background:#fdf0e6;
    transform:scale(1.05);
  }

  #entry-title{
    width:100%;
    border:none;
    border-bottom:1.5px solid var(--line);
    background:transparent;
    font-family:'Playfair Display',serif;
    font-size:1.15rem;
    padding:6px 2px 10px;
    margin-bottom:10px;
    outline:none;
    color:var(--ink);
  }
  #entry-title::placeholder{color:#c7b9a8;}

  #entry-content{
    width:100%;
    min-height:130px;
    border:none;
    background:transparent;
    resize:vertical;
    font-size:0.95rem;
    line-height:1.6;
    outline:none;
    color:var(--ink);
  }
  #entry-content::placeholder{color:#c7b9a8;}

  .save-row{display:flex;justify-content:flex-end;margin-top:10px;}
  .save-btn{
    background:var(--terracotta);
    color:#fff;
    border:none;
    padding:10px 22px;
    border-radius:12px;
    font-weight:700;
    font-size:0.9rem;
  }
  .save-btn:hover{background:var(--terracotta-dark);}

  #entries-section h2{
    font-size:1.1rem;
    color:var(--ink);
    margin:0 0 14px 4px;
  }
  #search-box{
    width:100%;
    padding:10px 14px;
    border-radius:12px;
    border:1.5px solid var(--line);
    background:var(--paper);
    margin-bottom:16px;
    font-size:0.88rem;
    outline:none;
  }
  #search-box:focus{border-color:var(--terracotta);}

  .entry-item{
    background:var(--paper);
    border-radius:16px;
    padding:16px 18px;
    margin-bottom:12px;
    box-shadow:0 4px 14px rgba(74,63,54,0.06);
    cursor:pointer;
    transition:transform 0.15s;
    position:relative;
  }
  .entry-item:hover{transform:translateY(-2px);}
  .entry-item .e-top{
    display:flex;justify-content:space-between;align-items:baseline;
    margin-bottom:4px;
  }
  .entry-item .e-title{
    font-family:'Playfair Display',serif;
    font-size:1.02rem;
    color:var(--ink);
  }
  .entry-item .e-date{
    font-size:0.72rem;
    color:var(--ink-soft);
    white-space:nowrap;
    margin-left:10px;
  }
  .entry-item .e-preview{
    font-size:0.85rem;
    color:var(--ink-soft);
    line-height:1.5;
    overflow:hidden;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
  }
  .entry-item .e-mood{
    position:absolute;top:14px;right:16px;
    font-size:1rem;
  }
  .del-btn{
    position:absolute;
    bottom:12px;right:14px;
    background:none;
    border:none;
    color:#c7b9a8;
    font-size:0.75rem;
  }
  .del-btn:hover{color:#b5482f;}

  #empty-state{
    text-align:center;
    color:var(--ink-soft);
    font-size:0.9rem;
    padding:30px 10px;
  }
  #empty-state .script{font-size:1.05rem;color:var(--terracotta-dark);display:block;margin-bottom:6px;}

  footer{
    text-align:center;
    font-size:0.75rem;
    color:#b6a998;
    padding:10px 0 30px;
  }

  /* ---------- FLOATING MUSIC PLAYER ---------- */
  #player{
    position:fixed;
    bottom:18px;right:18px;
    z-index:30;
    font-family:'Nunito',sans-serif;
  }
  #player-bubble{
    width:56px;height:56px;
    border-radius:50%;
    background:var(--terracotta);
    color:#fff;
    border:none;
    box-shadow:var(--shadow);
    font-size:1.3rem;
    display:flex;align-items:center;justify-content:center;
  }
  #player-panel{
    display:none;
    position:absolute;
    bottom:66px;right:0;
    width:250px;
    background:var(--paper);
    border-radius:18px;
    box-shadow:var(--shadow);
    padding:16px;
  }
  #player-panel.open{display:block;}
  #player-panel .p-title{
    font-family:'Playfair Display',serif;
    font-size:0.95rem;
    color:var(--ink);
    margin-bottom:2px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  #player-panel .p-sub{
    font-size:0.72rem;
    color:var(--ink-soft);
    margin-bottom:10px;
  }
  .p-controls{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:14px;
    margin-bottom:12px;
  }
  .p-controls button{
    background:none;border:none;
    font-size:1.15rem;
    color:var(--terracotta-dark);
  }
  .p-controls button.play-pause{
    background:var(--terracotta);
    color:#fff;
    width:38px;height:38px;
    border-radius:50%;
    font-size:1rem;
  }
  .p-slider-row{
    margin-bottom:10px;
  }
  .p-slider-row label{
    font-size:0.7rem;
    color:var(--ink-soft);
    display:flex;
    justify-content:space-between;
    margin-bottom:3px;
  }
  .p-slider-row input[type="range"]{
    width:100%;
    accent-color:var(--terracotta);
  }
  #player-tracklist{
    display:flex;flex-direction:column;gap:4px;
    max-height:110px;
    overflow-y:auto;
  }
  .p-track{
    text-align:left;
    background:none;
    border:none;
    padding:6px 8px;
    border-radius:8px;
    font-size:0.78rem;
    color:var(--ink-soft);
  }
  .p-track.active{
    background:#fdf0e6;
    color:var(--terracotta-dark);
    font-weight:700;
  }
  #player-note{
    font-size:0.65rem;
    color:#c7b9a8;
    margin-top:8px;
    line-height:1.4;
  }

  /* modal for viewing/editing an entry */
  #entry-modal{
    position:fixed;inset:0;
    background:rgba(74,63,54,0.35);
    display:none;
    align-items:center;justify-content:center;
    z-index:40;
    padding:20px;
  }
  #entry-modal .modal-card{
    background:var(--paper);
    border-radius:20px;
    padding:24px;
    width:100%;max-width:480px;
    max-height:85vh;
    overflow-y:auto;
    box-shadow:var(--shadow);
  }
  #entry-modal .modal-top{
    display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px;
  }
  #entry-modal .modal-date{font-size:0.78rem;color:var(--ink-soft);}
  #entry-modal .modal-close{
    background:none;border:none;font-size:1.3rem;color:var(--ink-soft);line-height:1;
  }
  #entry-modal .modal-title{
    font-family:'Playfair Display',serif;font-size:1.25rem;margin:6px 0 12px;color:var(--ink);
  }
  #entry-modal .modal-body{
    font-size:0.95rem;line-height:1.7;color:var(--ink);white-space:pre-wrap;
  }

  @media(min-width:520px){
    header.hero{padding:34px 20px 100px;}
  }
</style>
</head>

<!-- LOCK SCREEN -->

  <main>
    <div class="card" id="new-entry">
      <div class="row-top">
        <h2 id="form-heading">New entry</h2>
        <span id="entry-date"></span>
      </div>
      <div class="mood-row" id="mood-row">
        <button class="mood-btn" data-mood="😊">😊</button>
        <button class="mood-btn" data-mood="🥰">🥰</button>
        <button class="mood-btn" data-mood="😔">😔</button>
        <button class="mood-btn" data-mood="😴">😴</button>
        <button class="mood-btn" data-mood="😤">😤</button>
        <button class="mood-btn" data-mood="✨">✨</button>
      </div>
      <input type="text" id="entry-title" placeholder="Give today a title..." />
      <textarea id="entry-content" placeholder="Dear diary..."></textarea>
      <div class="save-row">
        <button class="save-btn" id="save-btn">Save entry</button>
      </div>
    </div>

    <div id="entries-section">
      <h2>Your entries</h2>
      <input type="text" id="search-box" placeholder="Search your entries..." />
      <div id="entries-list"></div>
      <div id="empty-state" style="display:none;">
        <span class="script">Nothing here yet</span>
        Write your first entry above 🌷
      </div>
    </div>
  </main>

  <footer>made with care, just for you 🤎</footer>
</div>

<div id="player">
  <div id="player-panel">
    <div class="p-title" id="p-track-title">No song loaded</div>

    <div class="p-controls">
      <button id="p-prev" title="Previous">⏮</button>

      <label><span>Reverb</span><span id="p-reverb-val">35%</span></label>
      <input type="range" id="p-reverb" min="0" max="100" value="35" />
    </div>
    <div class="p-slider-row">
      <label><span>Volume</span><span id="p-vol-val">70%</span></label>

</div>

    </div>
    <div class="modal-title" id="modal-title"></div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<script>
const lockScreen = document.getElementById('lock-screen');
const lockTitle = document.getElementById('lock-title');
const lockSub = document.getElementById('lock-sub');
const pwInput = document.getElementById('pw-input');
const pwConfirm = document.getElementById('pw-confirm');
const pwSubmit = document.getElementById('pw-submit');
const lockError = document.getElementById('lock-error');
const lockHint = document.getElementById('lock-hint');
const app = document.getElementById('app');

let mode = 'checking'; // checking | create | verify
const PW_KEY = 'neha-diary-password';
const ENTRIES_KEY = 'neha-diary-entries';

function initLock(){
  const stored = localStorage.getItem(PW_KEY);
  if(stored){
    mode = 'verify';
    lockSub.textContent = 'Enter your password';
    pwConfirm.style.display = 'none';
    lockHint.style.display = 'inline-block';
  } else {
    mode = 'create';
    lockSub.textContent = 'Set a password for your diary';
    pwConfirm.style.display = 'block';
  }
}
initLock();

pwSubmit.addEventListener('click', handleLockSubmit);
pwInput.addEventListener('keydown', (e)=>{ if(e.key==='Enter') handleLockSubmit(); });
pwConfirm.addEventListener('keydown', (e)=>{ if(e.key==='Enter') handleLockSubmit(); });

function handleLockSubmit(){
  lockError.textContent = '';
  const val = pwInput.value.trim();
  if(!val){ lockError.textContent = 'please type something'; return; }

  if(mode === 'create'){
    const confirmVal = pwConfirm.value.trim();
    if(val.length < 3){ lockError.textContent = 'at least 3 characters'; return; }
    if(val !== confirmVal){ lockError.textContent = "passwords don't match"; return; }
    try{
      localStorage.setItem(PW_KEY, val);
      unlock();
    }catch(e){
      lockError.textContent = 'could not save, try again';
    }
  } else if(mode === 'verify'){
    const stored = localStorage.getItem(PW_KEY);
    if(stored === val){
      unlock();
    } else {
      lockError.textContent = 'that password is not right';
      pwInput.value = '';
    }
  }
}

lockHint.addEventListener('click', ()=>{
  const sure = confirm('Reset your diary password? Your entries will stay safe, only the password resets.');
  if(sure){
    localStorage.removeItem(PW_KEY);
    mode = 'create';
    lockSub.textContent = 'Set a new password';
    pwConfirm.style.display = 'block';
    lockHint.style.display = 'none';
    pwInput.value = '';
    lockError.textContent = '';
  }
});

function unlock(){
  lockScreen.style.opacity = '0';
  setTimeout(()=>{ lockScreen.style.display = 'none'; }, 500);
  app.style.display = 'block';
  loadEntries();
}

document.getElementById('lock-toggle').addEventListener('click', ()=>{
  location.reload();
});

// ---------- DIARY LOGIC ----------
const entryDateEl = document.getElementById('entry-date');
const entryTitleEl = document.getElementById('entry-title');
const entryContentEl = document.getElementById('entry-content');
const moodRow = document.getElementById('mood-row');
const saveBtn = document.getElementById('save-btn');
const entriesList = document.getElementById('entries-list');
const emptyState = document.getElementById('empty-state');
const searchBox = document.getElementById('search-box');
const formHeading = document.getElementById('form-heading');

let selectedMood = '😊';
let editingId = null;
let allEntries = [];

const today = new Date();
entryDateEl.textContent = today.toLocaleDateString(undefined, {weekday:'long', month:'long', day:'numeric'});

document.querySelectorAll('.mood-btn').forEach(btn=>{
  if(btn.dataset.mood === selectedMood) btn.classList.add('selected');
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.mood-btn').forEach(b=>b.classList.remove('selected'));
    btn.classList.add('selected');
    selectedMood = btn.dataset.mood;
  });
});

function loadEntries(){
  try{
    const raw = localStorage.getItem(ENTRIES_KEY);
    allEntries = raw ? JSON.parse(raw) : [];
  }catch(e){
    allEntries = [];
  }
  renderEntries(allEntries);
}

function persistEntries(){
  try{
    localStorage.setItem(ENTRIES_KEY, JSON.stringify(allEntries));
  }catch(e){
    console.error('could not save entries', e);
  }
}

function renderEntries(list){
  entriesList.innerHTML = '';
  if(list.length === 0){
    emptyState.style.display = 'block';
    return;
  }
  emptyState.style.display = 'none';
  const sorted = [...list].sort((a,b)=> b.createdAt - a.createdAt);
  sorted.forEach(entry=>{
    const div = document.createElement('div');
    div.className = 'entry-item';
    const preview = (entry.content || '').slice(0, 140);
    div.innerHTML = `
      <span class="e-mood">${entry.mood || ''}</span>
      <div class="e-top">
        <span class="e-title">${escapeHtml(entry.title || 'Untitled')}</span>
        <span class="e-date">${entry.dateLabel}</span>
      </div>
      <div class="e-preview">${escapeHtml(preview)}</div>
      <button class="del-btn" data-id="${entry.id}">delete</button>
    `;
    div.addEventListener('click', (e)=>{
      if(e.target.classList.contains('del-btn')) return;
      openModal(entry);
    });
    div.querySelector('.del-btn').addEventListener('click', (e)=>{
      e.stopPropagation();
      if(confirm('Delete this entry?')){
        allEntries = allEntries.filter(x=>x.id !== entry.id);
        persistEntries();
        renderEntries(filterCurrent());
      }
    });
    entriesList.appendChild(div);
  });
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

saveBtn.addEventListener('click', ()=>{
  const title = entryTitleEl.value.trim();
  const content = entryContentEl.value.trim();
  if(!title && !content) return;
  const now = new Date();
  const newEntry = {
    id: Date.now().toString(),
    title: title || 'Untitled',
    content,
    mood: selectedMood,
    createdAt: now.getTime(),
    dateLabel: now.toLocaleDateString(undefined, {month:'short', day:'numeric', year:'numeric'})
  };
  allEntries.push(newEntry);
  persistEntries();
  entryTitleEl.value = '';
  entryContentEl.value = '';
  renderEntries(filterCurrent());
});

searchBox.addEventListener('input', ()=>{
  renderEntries(filterCurrent());
});

function filterCurrent(){
  const q = searchBox.value.trim().toLowerCase();
  if(!q) return allEntries;
  return allEntries.filter(e =>
    (e.title||'').toLowerCase().includes(q) || (e.content||'').toLowerCase().includes(q)
  );
}

// modal
const modal = document.getElementById('entry-modal');
const modalTitle = document.getElementById('modal-title');
const modalDate = document.getElementById('modal-date');
const modalBody = document.getElementById('modal-body');
document.getElementById('modal-close').addEventListener('click', ()=>{ modal.style.display='none'; });
modal.addEventListener('click', (e)=>{ if(e.target === modal) modal.style.display='none'; });

function openModal(entry){
  modalTitle.textContent = (entry.mood ? entry.mood + ' ' : '') + entry.title;
  modalDate.textContent = entry.dateLabel;
  modalBody.textContent = entry.content;
  modal.style.display = 'flex';
}

// ---------- FLOATING MUSIC PLAYER (Web Audio API reverb, live) ----------
const PLAYLIST = [
  { title: 'Firfirey',        file: 'track1.mp3' },
  { title: 'Kasari',          file: 'track2.mp3' },
  { title: 'Laakhau Hajarau', file: 'track3.mp3' }
];

let audioCtx = null;
let sourceNode = null;
let convolver = null;
let dryGain = null;
let wetGain = null;
let masterGain = null;
let currentTrack = 0;
let isPlaying = false;

const audioEl = new Audio();
audioEl.preload = 'none';

const bubble = document.getElementById('player-bubble');
const panel = document.getElementById('player-panel');
const trackTitleEl = document.getElementById('p-track-title');
const trackStatusEl = document.getElementById('p-track-status');
const playBtn = document.getElementById('p-play');
const prevBtn = document.getElementById('p-prev');
const nextBtn = document.getElementById('p-next');
const reverbSlider = document.getElementById('p-reverb');
const reverbVal = document.getElementById('p-reverb-val');
const volSlider = document.getElementById('p-vol');
const volVal = document.getElementById('p-vol-val');
const tracklistEl = document.getElementById('player-tracklist');

function buildTracklist(){
  tracklistEl.innerHTML = '';
  PLAYLIST.forEach((t, i)=>{
    const b = document.createElement('button');
    b.className = 'p-track' + (i === currentTrack ? ' active' : '');
    b.textContent = t.title;
    b.addEventListener('click', ()=> loadTrack(i, true));
    tracklistEl.appendChild(b);
  });
}
buildTracklist();

bubble.addEventListener('click', ()=>{
  panel.classList.toggle('open');
});

function ensureAudioGraph(){
  if(audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  sourceNode = audioCtx.createMediaElementSource(audioEl);
  convolver = audioCtx.createConvolver();
  convolver.buffer = makeImpulseResponse(audioCtx, 2.4, 2.8);
  dryGain = audioCtx.createGain();
  wetGain = audioCtx.createGain();
  masterGain = audioCtx.createGain();

  const reverbAmt = reverbSlider.value / 100;
  wetGain.gain.value = reverbAmt;
  dryGain.gain.value = 1 - reverbAmt * 0.5;
  masterGain.gain.value = volSlider.value / 100;

  sourceNode.connect(dryGain).connect(masterGain);
  sourceNode.connect(convolver).connect(wetGain).connect(masterGain);
  masterGain.connect(audioCtx.destination);
}

function makeImpulseResponse(ctx, duration, decay){
  const rate = ctx.sampleRate;
  const length = rate * duration;
  const impulse = ctx.createBuffer(2, length, rate);
  for(let ch = 0; ch < 2; ch++){
    const data = impulse.getChannelData(ch);
    for(let i = 0; i < length; i++){
      data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / length, decay);
    }
  }
  return impulse;
}

function loadTrack(i, autoplay){
  currentTrack = i;
  const t = PLAYLIST[i];
  audioEl.src = t.file;
  trackTitleEl.textContent = t.title;
  trackStatusEl.textContent = autoplay ? 'loading...' : 'ready';
  buildTracklist();
  if(autoplay){
    ensureAudioGraph();
    audioEl.play().then(()=>{
      isPlaying = true;
      playBtn.textContent = '⏸';
      trackStatusEl.textContent = 'now playing';
    }).catch(()=>{
      trackStatusEl.textContent = "couldn't find " + t.file + ' — add it next to this page';
    });
  }
}
loadTrack(0, false);

playBtn.addEventListener('click', ()=>{
  ensureAudioGraph();
  if(audioCtx.state === 'suspended') audioCtx.resume();
  if(isPlaying){
    audioEl.pause();
    isPlaying = false;
    playBtn.textContent = '▶';
    trackStatusEl.textContent = 'paused';
  } else {
    audioEl.play().then(()=>{
      isPlaying = true;
      playBtn.textContent = '⏸';
      trackStatusEl.textContent = 'now playing';
    }).catch(()=>{
      trackStatusEl.textContent = "couldn't find " + PLAYLIST[currentTrack].file + ' — add it next to this page';
    });
  }
});

prevBtn.addEventListener('click', ()=>{
  const i = (currentTrack - 1 + PLAYLIST.length) % PLAYLIST.length;
  loadTrack(i, true);
});
nextBtn.addEventListener('click', ()=>{
  const i = (currentTrack + 1) % PLAYLIST.length;
  loadTrack(i, true);
});
audioEl.addEventListener('ended', ()=>{
  const i = (currentTrack + 1) % PLAYLIST.length;
  loadTrack(i, true);
});

reverbSlider.addEventListener('input', ()=>{
  const v = reverbSlider.value / 100;
  reverbVal.textContent = reverbSlider.value + '%';
  if(wetGain && dryGain){
    wetGain.gain.value = v;
    dryGain.gain.value = 1 - v * 0.5;
  }
});
volSlider.addEventListener('input', ()=>{
  volVal.textContent = volSlider.value + '%';
  if(masterGain) masterGain.gain.value = volSlider.value / 100;
});
</script>
